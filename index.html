<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyhetsradar V17</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css"> 
  
</head>

<body>

<header id="greeting">🌙 God kväll</header>

<div id="today"
style="
text-align:center;
margin-top:-10px;
margin-bottom:12px;
font-size:16px;
opacity:.85;
">
</div> 
  
<div class="top">

  <div class="market">
    🇸🇪 Sverige
    <small id="se"></small>
  </div>

  <div class="market">
    🇺🇸 USA
    <small id="us"></small>
  </div>

  <div class="market">
    🇨🇦 Kanada
    <small id="ca"></small>
  </div>

</div>

<div class="toolbox">

  <div class="toolbar">

    <input
    id="newStock"
    placeholder="Lägg till bolag">

    <div class="tool-buttons">

      <button onclick="addStock()">
      +
      </button>

      <button onclick="render()">
      🔄
      </button>

      <button onclick="exportStocks()">
      💾
      </button>

      <button
      onclick="
      document
      .getElementById(
      'importFile'
      )
      .click()
      ">
      📂
      </button>

    </div>

  </div>

</div>

<div id="list"></div>

<input
type="file"
id="importFile"
accept=".json"
style="display:none"
onchange="importStocks(event)"> 
  
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/news.js"></script>  

<script>

let stocks =
JSON.parse(localStorage.getItem("stocks"))
|| defaultStocks;

if(typeof stocks[0] === "string"){

  stocks = stocks.map(s=>({

    name:s,
    search:s,
    type:"uran",
    collapsed:false

  }));

}
 
function greet(){

  let h=new Date().getHours();

  if(h<5){
    greeting.innerHTML="🌙 God natt";
  }
  else if(h<10){
    greeting.innerHTML="☀️ God morgon";
  }
  else if(h<18){
    greeting.innerHTML="🌤️ God middag";
  }
  else{
    greeting.innerHTML="🌙 God kväll";
  }
}

function todayDate(){

  let d =
  new Date();

  let text =
  d.toLocaleDateString(
    "sv-SE",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  );

  text =
  text.charAt(0).toUpperCase()
  + text.slice(1);

  document
  .getElementById("today")
  .innerHTML = text;
}

function market(open,close,timeZone){

  let now =
  new Date();

  let local =
  new Date(

    now.toLocaleString(
      "en-US",
      { timeZone: timeZone }
    )

  );

  let day =
  local.getDay();

  if(day===0 || day===6){

    return "🔴 Stängt (helg)";
  }

  let h =
  local.getHours();

  if(h<open){

    return "🟡 Öppnar senare";
  }

  if(h>=open && h<close){

    return "🟢 Öppet";
  }

  return "🔴 Stängt";
}

function markets(){

  se.innerHTML=
  market(
    9,
    17,
    "Europe/Stockholm"
  );

  us.innerHTML=
  market(
    9,
    16,
    "America/New_York"
  );

  ca.innerHTML=
  market(
    9,
    16,
    "America/Toronto"
  );
 }

function toggleCollapse(i){

  stocks[i].collapsed =
  !stocks[i].collapsed;

  save();

  render();
}

function editStock(i,val){

  stocks[i].name=val;

  stocks[i].search=val;

  save();
}

async function render(){

  list.innerHTML="";

  let filtered =
  stocks;

  for(let i=0;i<filtered.length;i++){

    let s=filtered[i];

    let realIndex =
    stocks.indexOf(s);

    let row=
    document.createElement("div");

    row.className = "row";
  

    row.innerHTML=`

    <div class="left">

      <input
      class="stock-edit"
      value="${s.name}"
      onchange="editStock(
      ${realIndex},
      this.value
      )">

      <div class="buttons">

        <button
        onclick="up(${realIndex})">
        ↑
        </button>

        <button
        onclick="down(${realIndex})">
        ↓
        </button>

        <button
        onclick="toggleCollapse(
        ${realIndex}
        )">

        ${s.collapsed ? "▸" : "▾"}

        </button>
        
        <button
        onclick="removeStock(
        ${realIndex}
        )">
        ×
        </button>

      </div>

    </div>

    <div class="news
    ${s.collapsed ? "hidden" : ""}"
    id="news${realIndex}">

      <div class="loading">

      Laddar nyheter...

      </div>

    </div>

    `;

    list.appendChild(row);

    if(!s.collapsed){

      getNews(s).then(html=>{

        document
        .getElementById(
        "news"+realIndex
        ).innerHTML=html;

      });

    }
  }

  save();
}

function addStock(){

  let v=
  newStock.value.trim();

  if(!v) return;

  stocks.push({

    name:v,
    search:v,
    type:"uran",
    collapsed:false

  });

  newStock.value="";

  render();
}

function removeStock(i){

  stocks.splice(i,1);

  render();
}

function up(i){

  if(i===0) return;

  [stocks[i],stocks[i-1]]
  =
  [stocks[i-1],stocks[i]];

  render();
}

function down(i){

  if(i===stocks.length-1)
  return;

  [stocks[i],stocks[i+1]]
  =
  [stocks[i+1],stocks[i]];

  render();
}

greet();

todayDate();
  
markets();

render();

setInterval(render,900000);

</script>

<script>

if ("serviceWorker" in navigator) {

  navigator.serviceWorker
  .register("./service-worker.js")

  .then(() => {

    console.log("Service Worker registrerad");

  });

}

</script>

</body>
</html>
